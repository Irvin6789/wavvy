# Configuration for `flutter analyze`.
#
# `flutter_lints` is deliberately NOT included: it is a pub.dev package, and this
# project must resolve with zero third-party dependencies. The rules below ship
# with the analyzer itself, so no download is required.
#
# This sandbox has no Flutter SDK, so tool/check_dart.mjs performs a static
# subset of these checks (delimiter balance, import resolution, material-only
# symbols, the non-uniform-Border/borderRadius assert). Run the real analyzer
# wherever a SDK is available.

analyzer:
  exclude:
    - .lucide-static/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_empty_else
    - avoid_print
    - avoid_relative_lib_imports
    - avoid_types_as_parameter_names
    - await_only_futures
    - camel_case_types
    - cancel_subscriptions
    - curly_braces_in_flow_control_structures
    - empty_statements
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_is_empty
    - prefer_is_not_empty
    - sized_box_for_whitespace
    - sort_child_properties_last
    - unnecessary_const
    - unnecessary_late
    - unnecessary_new
    - use_build_context_synchronously
    - use_full_hex_values_for_flutter_colors
    - use_key_in_widget_constructors
    - valid_regexps
